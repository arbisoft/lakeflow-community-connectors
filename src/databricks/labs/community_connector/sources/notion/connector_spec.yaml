# Notion Community Connector Spec
# This file defines the specification for the connector including
# connection parameters and allowlist options.

# ============================================================================
# Connection Parameters
# These are provided when creating the Unity Catalog connection.
# ============================================================================
connection:
  # ---------------------------------------------------------------------------
  # Single Authentication Method
  # ---------------------------------------------------------------------------
  parameters:
    - name: api_token
      type: string
      required: true
      secret: true
      description: >
        Your Notion Integration token (internal integration token).
        This token starts with "secret_" and can be obtained from the
        Notion Developer Portal at https://www.notion.so/my-integrations.

    - name: notion_version
      type: string
      required: false
      secret: false
      description: >
        Value sent in the Notion-Version header. Defaults to 2026-03-11,
        which is the minimum version supporting the Views API,
        GET /v1/file_uploads, and the meeting_notes block type. Pin to an
        earlier version (e.g. 2025-09-03) only if you need the older
        response shapes; the views table and the meeting_notes block
        column will be empty on those versions.

# ============================================================================
# External Options Allowlist
# These table-specific options must be included in the externalOptionsAllowList
# parameter of the UC connection to allow them to be passed through.
# Use a comma-separated string of option names.
# If no table-specific options are needed, set to empty string or omit.
# ============================================================================
#   max_records_per_batch          - rows per microbatch (all CDC tables)
#   resolve_truncated_properties   - repair >25-item page properties (pages)
#   max_property_items             - cap on items pulled for one property (pages)
#   max_block_depth                - recursion depth of the block crawl (blocks)
#   file_upload_status             - filter uploads by status (file_uploads)
external_options_allowlist: "max_records_per_batch,resolve_truncated_properties,max_property_items,max_block_depth,file_upload_status"