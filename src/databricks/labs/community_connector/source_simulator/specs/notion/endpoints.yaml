# Notion Simulator Spec
# This file defines the API endpoints for the Notion simulator

endpoints:
  # Search endpoint (POST) - used for pages and databases
  - path: search
    method: POST
    description: Search for pages and databases
    request:
      body_json:
        filter:
          role: filter
          op: equals
          field: object
        sort:
          role: sort
          field: last_edited_time
        page_size:
          role: per_page
          default: 100
        start_cursor:
          role: page
          default: null
    response:
      wrapper:
        records_key: results
      pagination_style: cursor
      cursor_field: next_cursor
      has_more_field: has_more

  # Users endpoint (GET)
  - path: users
    method: GET
    description: List all users in the workspace
    request:
      query_params:
        page_size:
          role: per_page
          default: 100
        start_cursor:
          role: page
          default: null
    response:
      wrapper:
        records_key: results
      pagination_style: cursor
      cursor_field: next_cursor
      has_more_field: has_more

  # Blocks children endpoint (GET)
  - path: blocks/{block_id}/children
    method: GET
    description: Get child blocks of a page or block
    request:
      path_params:
        block_id:
          role: filter
          required: true
      query_params:
        page_size:
          role: per_page
          default: 100
        start_cursor:
          role: page
          default: null
    response:
      wrapper:
        records_key: results
      pagination_style: cursor
      cursor_field: next_cursor
      has_more_field: has_more

  # Comments endpoint (GET)
  - path: comments
    method: GET
    description: Get comments on a page or block
    request:
      query_params:
        block_id:
          role: filter
          required: false
        page_id:
          role: filter
          required: false
        page_size:
          role: per_page
          default: 100
        start_cursor:
          role: page
          default: null
    response:
      wrapper:
        records_key: results
      pagination_style: cursor
      cursor_field: next_cursor
      has_more_field: has_more

  # Database query endpoint (POST)
  - path: databases/{database_id}/query
    method: POST
    description: Query a database
    request:
      path_params:
        database_id:
          role: filter
          required: true
      body_json:
        filter:
          role: filter
        sorts:
          role: sort
        page_size:
          role: per_page
          default: 100
        start_cursor:
          role: page
          default: null
    response:
      wrapper:
        records_key: results
      pagination_style: cursor
      cursor_field: next_cursor
      has_more_field: has_more